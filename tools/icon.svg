<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Nexo Workspace · una «N» formada por cuatro nodos conectados -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16213e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="nd" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4d4ff"/></radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="128" cy="128" r="96" fill="url(#glow)"/>
  <path d="M78 186 V70 L178 186 V70" fill="none" stroke="url(#ln)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="url(#ln)" stroke-width="7">
    <circle cx="78" cy="186" r="19" fill="url(#nd)"/>
    <circle cx="78" cy="70" r="19" fill="url(#nd)"/>
    <circle cx="178" cy="186" r="19" fill="url(#nd)"/>
    <circle cx="178" cy="70" r="19" fill="url(#nd)"/>
  </g>
  <circle cx="128" cy="128" r="9" fill="#22d3ee"/>
