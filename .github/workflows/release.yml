# Cada push a main compila el instalador y lo publica como Release de GitHub.
# La app instalada (electron-updater) detecta la Release nueva y se actualiza sola:
# no hace falta `npm run pack` ni subir nada a mano.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # versión = la de package.json con el parche sustituido por el nº de ejecución (siempre creciente)
      - name: Versión automática
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "$base.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      # releaseType "release" exige que el tag exista ya ("Published releases must have a valid tag")
      - name: Crear tag
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          git tag "v$v"
          git push origin "v$v"
      - name: Compilar y publicar
        run: npx electron-vite build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
