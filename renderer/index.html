<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shutoki</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<aside class="side">
  <div class="brand">◆ Shutoki</div>
  <nav id="nav">
    <button data-view="today" class="active">☀ Hoy</button>
    <button data-view="board">▦ Tablero</button>
    <button data-view="hours">⏱ Horas</button>
    <button data-view="settings">⚙ Ajustes</button>
  </nav>
  <div class="side-foot">
    <div id="dayBar"></div>
    <small>Ctrl+Alt+N: captura rápida</small>
    <div class="profile" id="profile"></div>
  </div>
</aside>
<main>
  <div id="timerBar" class="timerbar hidden"></div>
  <section id="view"></section>
</main>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
